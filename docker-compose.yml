services:
  db:
    image: pgvector/pgvector:pg16
    container_name: github_search_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: github_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d github_search"]
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: github_search_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github_search_api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@db:5432/github_search
      - USE_POSTGRES=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=repositories
      - QDRANT_ON_DISK=true
      - DATASET_PATH=/app/data/repo_metadata.json
      - AUTO_INGEST_ON_STARTUP=true
      - AUTO_INGEST_SAMPLE_SIZE=0
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/repo_metadata.json:/app/data/repo_metadata.json:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github_search_frontend
    restart: unless-stopped
    command: streamlit run src/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - FASTAPI_URL=http://api:8000/api
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data:
